# 원래 URI와 쿠키를 유지한다. Docker DNS를 재조회하여 API 재생성에도 대응한다.
resolver 127.0.0.11 valid=5s ipv6=off;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # API가 원래 요청의 프로토콜을 판단할 때 쓰도록 Nginx에서 값을 지정한다.
    proxy_set_header X-Forwarded-Proto $scheme;
    # API 접두어 자체와 그 하위 경로를 각각 처리한다. 각 서비스는 내부 네트워크의 고정 별칭으로 찾는다.
    location = /api/auth { set $user_api ourspot-user-api:3000; proxy_pass http://$user_api; }
    location /api/auth/ { set $user_api ourspot-user-api:3000; proxy_pass http://$user_api; }
    location = /api/places { set $place_api ourspot-place-api:3000; proxy_pass http://$place_api; }
    location /api/places/ { set $place_api ourspot-place-api:3000; proxy_pass http://$place_api; }
    # 정의되지 않은 API 경로는 여기서 404로 끝낸다. 그 밖의 화면과 정적 파일은 Apache로 전달한다.
    location /api/ { return 404; }
    location / { set $front ourspot-front:80; proxy_pass http://$front; }
}
