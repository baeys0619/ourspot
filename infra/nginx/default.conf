# 원래 URI와 쿠키를 유지한다. Docker DNS를 재조회하여 API 재생성에도 대응한다.
resolver 127.0.0.11 valid=5s ipv6=off;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /api/auth { set $user_api ourspot-user-api:3000; proxy_pass http://$user_api; }
    location /api/auth/ { set $user_api ourspot-user-api:3000; proxy_pass http://$user_api; }
    location = /api/places { set $place_api ourspot-place-api:3000; proxy_pass http://$place_api; }
    location /api/places/ { set $place_api ourspot-place-api:3000; proxy_pass http://$place_api; }
    location /api/ { return 404; }
    location / { set $front ourspot-front:80; proxy_pass http://$front; }
}
