<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장소 상세 · OURSPOT</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script type="module" src="/js/detail.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="frame header-bar">
      <a class="brand" href="/index.html">OURSPOT</a>
      <nav aria-label="주요 메뉴">
        <a href="/index.html" aria-current="true"><span class="desktop">장소 보관함</span><span class="mobile">장소</span></a>
        <a href="/plans.html"><span class="desktop">데이트 계획</span><span class="mobile">계획</span></a>
      </nav>
      <div id="account" class="account" hidden>
        <span id="current-user"></span>
        <button type="button" id="logout" class="text-button">로그아웃</button>
      </div>
    </div>
  </header>
  <main class="frame detail" id="main" tabindex="-1">
    <a class="back-link" href="/index.html">‹ 장소 보관함<span class="desktop">으로</span></a>
    <p id="account-error" class="feedback error" role="alert"></p>
    <p id="detail-status" role="status" tabindex="-1">장소를 불러오는 중…</p>
    <!-- 인증 후 장소 조회가 성공하면 표시한다. 방문 상태가 달라지면 코멘트 편집 가능 단계도 다시 확인한다. -->
    <article id="place-detail" aria-busy="true" hidden>
      <div class="detail-heading">
        <div>
          <h1 id="detail-title"></h1>
          <div id="detail-tags" class="tags"></div>
        </div>
        <button id="toggle-visit" class="button primary" type="button" disabled>방문 완료로 변경</button>
      </div>
      <p id="detail-notice" class="feedback" role="status"></p>
      <div class="detail-grid">
        <section class="detail-info" aria-labelledby="info-title">
          <h2 id="info-title">장소 정보</h2>
          <dl id="detail-fields" class="place-fields"></dl>
          <div class="detail-actions">
            <button id="edit-place" class="text-button accent" type="button" disabled>장소 정보 수정</button>
            <button id="delete-place" class="text-button danger" type="button" disabled>장소 삭제</button>
          </div>
        </section>
        <!-- 방문 전·후 영역에 두 사람의 기록을 구분해 넣는다. 조회에 실패하면 이 영역에서 다시 시도할 수 있다. -->
        <section id="comments" class="comments" aria-labelledby="comments-title">
          <h2 id="comments-title" tabindex="-1">둘의 기록</h2>
          <p id="comments-notice" class="feedback" role="status"></p>
          <div id="comments-state" class="feedback" hidden>
            <p id="comments-status" role="status"></p>
            <button id="retry-comments" class="button secondary" type="button" hidden>다시 시도</button>
          </div>
          <div id="comment-phases" hidden>
            <section class="comment-phase" aria-labelledby="before-title">
              <div class="comment-phase-heading">
                <h3 id="before-title">방문 전</h3>
                <p class="desktop muted">가기 전 기대했던 점</p>
              </div>
              <div id="before-comments" class="comment-cards"></div>
            </section>
            <section class="comment-phase" aria-labelledby="after-title">
              <div class="comment-phase-heading">
                <h3 id="after-title">방문 후</h3>
                <p class="desktop muted">다녀온 뒤 남길 이야기</p>
              </div>
              <div id="after-comments" class="comment-cards"></div>
            </section>
            <p class="desktop fine-print">코멘트는 본인만 수정·삭제할 수 있어요.</p>
          </div>
        </section>
      </div>
    </article>
  </main>
  <!-- 수정 충돌이 나면 폼을 열어 둔다. 사용자가 바꾼 값은 입력란에 남기고 현재 저장된 값은 edit-latest에 표시한다. -->
  <dialog id="place-dialog" aria-labelledby="save-title" aria-describedby="save-description">
    <form id="place-form" method="post" novalidate>
      <h2 id="save-title">장소 정보 수정</h2>
      <p id="save-description" class="muted">변경한 내용은 두 사람의 보관함에 반영돼요.</p>
      <p id="save-error" class="feedback error" role="alert"></p>
      <div id="edit-latest" class="feedback" hidden></div>
      <div class="field">
        <label for="place-title">장소명 *</label>
        <input id="place-title" name="title" required autofocus placeholder="장소 이름" aria-describedby="title-error">
        <p id="title-error" class="field-error"></p>
      </div>
      <div class="field">
        <label for="category">카테고리 *</label>
        <select id="category" name="category" required aria-describedby="category-error">
          <option>카페</option>
          <option>맛집</option>
          <option>놀거리</option>
          <option>기타</option>
        </select>
        <p id="category-error" class="field-error"></p>
      </div>
      <div class="field">
        <label for="source-url">URL (선택)</label>
        <input id="source-url" name="source_url" type="url" placeholder="https://example.com/spot" aria-describedby="source_url-error">
        <p id="source_url-error" class="field-error"></p>
      </div>
      <div class="field">
        <label for="memo">메모 (선택)</label>
        <textarea id="memo" name="memo" rows="1" placeholder="방문하고 싶은 이유" aria-describedby="memo-error"></textarea>
        <p id="memo-error" class="field-error"></p>
      </div>
      <p class="fine-print">저장한 사람과 날짜는 자동으로 기록돼요.</p>
      <div class="dialog-actions">
        <button type="button" id="cancel-save" class="button secondary">취소</button>
        <button type="submit" id="save-place" class="button primary">장소 저장</button>
      </div>
    </form>
  </dialog>
  <!-- 방문 전·후 코멘트에 같은 편집창을 쓴다. 작성자와 단계는 현재 사용자와 버튼을 누른 위치에서 정한다. -->
  <dialog id="comment-dialog" aria-labelledby="comment-dialog-title">
    <form id="comment-form" method="post" novalidate>
      <h2 id="comment-dialog-title"></h2>
      <p id="comment-author" class="accent"></p>
      <p id="comment-error" class="feedback error" role="alert"></p>
      <a id="comment-sign-in" href="/login.html?reason=expired" hidden>로그인 화면으로 이동</a>
      <button id="retry-comment-editor" type="button" class="button secondary" hidden>최신 정보 다시 조회</button>
      <div class="field">
        <label for="comment-content">코멘트</label>
        <textarea id="comment-content" name="content" rows="3" required autofocus
          aria-describedby="comment-count comment-content-error"></textarea>
        <p id="comment-count" class="fine-print"></p>
        <p id="comment-content-error" class="field-error"></p>
      </div>
      <div class="dialog-actions">
        <button id="cancel-comment" type="button" class="button secondary">취소</button>
        <button id="save-comment" type="submit" class="button primary">저장</button>
      </div>
    </form>
  </dialog>
</body>
</html>
